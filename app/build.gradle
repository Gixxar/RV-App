plugins { id 'com.android.application' }
android {
    namespace 'com.poulton.rvapp'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'com.poulton.rvapp'; minSdk 26; targetSdk 35; versionCode 5; versionName '1.3.0' }
    signingConfigs {
        debug {
            def suppliedKey=System.getenv('RV_APP_SIGNING_KEY')
            if(suppliedKey){storeFile file(suppliedKey);storePassword 'android';keyAlias 'androiddebugkey';keyPassword 'android'}
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
